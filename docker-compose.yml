services:
  flp2score:
    build: .
    image: flp2score:latest
    container_name: flp2score
    ports:
      - "8090:8000"          # web UI at http://localhost:8090
    volumes:
      - ./data:/app/data     # projects: data/<name>/<name>.flp (+ mapping.json)
      - ./output:/app/output # scores
      # Optional: a folder of FL Studio projects to browse with the Studio button (read-only)
      # - /path/to/FL Studio/Projects:/library:ro
    restart: unless-stopped
