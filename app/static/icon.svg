<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PocketComposer: a music note popping out of a pocket">
  <title>PocketComposer</title>
  <rect width="64" height="64" rx="16" fill="#095b1b"/>
  <!-- eighth note rising out of the pocket -->
  <g transform="rotate(-12 32 26)" fill="#ffffff">
    <ellipse cx="29" cy="31" rx="6.4" ry="4.8" transform="rotate(-22 29 31)"/>
    <path d="M33.2 30 V10 C37 11.5 41.5 13.5 42.5 18.5 C43 21.5 41.8 23.4 40.4 24.3 C40.8 20.8 38.2 18.3 35.6 17.4 V30 Z"/>
  </g>
  <!-- motion lines -->
  <g stroke="#4cc26a" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M17 17 L20.5 20"/><path d="M47.5 25 L44 27"/><path d="M14 26 H18"/>
  </g>
  <!-- the pocket -->
  <path d="M13 36 H51 V47.5 L32 56 L13 47.5 Z" fill="#0f1117" stroke="#4cc26a" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M17.5 40.5 H46.5 V46 L32 52.5 L17.5 46 Z" fill="none" stroke="#4cc26a" stroke-width="1.2" stroke-dasharray="2.2 2" opacity=".8"/>
</svg>
