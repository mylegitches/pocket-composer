<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Pocket Composer</title>
  <!-- the note, tilted as if it's hopping out of the pocket (drawn first so the pocket hides its lower edge) -->
  <g transform="translate(0 -3) rotate(-14 32 24)" stroke="#fff" stroke-width="2" stroke-linejoin="round" paint-order="stroke">
    <path d="M37 26 V5 C41 7 46 9 47 15 C47.5 18.5 46 20.5 44.5 21.5 C45 17.5 42 14.5 39 13.5 V26 Z" fill="#1d1d1f"/>
    <ellipse cx="32.5" cy="27" rx="7.2" ry="5.3" transform="rotate(-22 32.5 27)" fill="#1d1d1f"/>
  </g>
  <!-- motion lines -->
  <g stroke="#e0632a" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M18 14 L22 17"/>
    <path d="M15 22 L20 22.5"/>
    <path d="M51 6 L48.5 10"/>
  </g>
  <!-- jeans back pocket -->
  <path d="M10 29 H54 V47 L32 60 L10 47 Z" fill="#e0632a" stroke="#b84a1a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M10 29 H54 V33.5 H10 Z" fill="#c9541f"/>
  <path d="M14.5 37 H49.5 V45 L32 55.5 L14.5 45 Z" fill="none" stroke="#ffd9c2" stroke-width="1.3"
        stroke-dasharray="2.6 2" stroke-linejoin="round"/>
</svg>
